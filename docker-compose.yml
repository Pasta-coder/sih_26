version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
      # O2: named volume so SQLite survives down/up and never lands on the host
      - dbdata:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/compliance.db
      - USE_REAL_TIER1_APIS=false
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    # O1: point the Vite dev proxy at the backend container, not localhost
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    command: npm run dev -- --host

volumes:
  uploads:
  dbdata:
